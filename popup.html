<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ro'eh — Link Safety</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { width: 300px; margin: 0; padding: 18px; color: #f8fafc; background: #111827; }
    h1 { margin: 0 0 4px; font-size: 19px; }
    .intro, .note { color: #cbd5e1; font-size: 12px; line-height: 1.5; }
    .stats { margin: 16px 0; padding: 12px; border: 1px solid #334155; border-radius: 10px; }
    .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
    .value { font-weight: 700; }
    button { width: 100%; padding: 11px; border: 0; border-radius: 8px; color: #fff; background: #6d5ce8; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #5746d2; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #message { min-height: 34px; }
  </style>
</head>
<body>
  <h1>Ro'eh</h1>
  <p class="intro">A quick, local check for common link warning signs.</p>
  <section class="stats" aria-live="polite">
    <div class="row"><span>Web links checked</span><span class="value" id="scannedCount">—</span></div>
    <div class="row"><span>Warning signals</span><span class="value" id="warningCount">—</span></div>
    <div class="row"><span>Status</span><span class="value" id="status">Checking…</span></div>
  </section>
  <button id="scanPage" type="button">Rescan this page</button>
  <p class="note" id="message">A lack of warnings is not a safety guarantee.</p>
  <script src="popup.js"></script>
</body>
</html>
